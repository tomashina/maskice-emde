[extend]
useDefault = true

[[allowlists]]
description = "OpenCart permission route names falsely detected as generic API keys"
rules = ["generic-api-key"]
regexTarget = "match"
regexes = [
  '''access',\s*'catalog/manufacturer''',
  '''access',\s*'marketplace/modification''',
  '''access',\s*'marketing/coupon''',
]

